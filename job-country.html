<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมัครงานต่างประเทศ | Winner 96</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="job" data-brand="w96">
  <div id="site-header"></div>
  <main id="country-page"></main>
  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/jobs-data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/thai-date.js"></script>
  <script>
    /* Render the country page from JOB_COUNTRIES (js/jobs-data.js) */
    (function () {
      const slug = new URLSearchParams(location.search).get("c") || "taiwan";
      const c = JOB_COUNTRIES.find((x) => x.slug === slug && x.active);
      const main = document.getElementById("country-page");
      const esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

      if (!c) {
        main.innerHTML = `<div class="not-found container">
          <h1 class="page-title">ยังไม่เปิดรับสมัครประเทศนี้</h1>
          <p class="section-sub">กรุณาเลือกประเทศอื่นที่เปิดรับสมัครอยู่</p>
          <a href="job.html" class="btn btn-navy" style="margin-top:24px">ดูประเทศทั้งหมด</a></div>`;
        return;
      }
      document.title = `สมัครงานประเทศ${c.nameTh} (${c.nameEn}) | Winner 96`;

      const rows = c.positions.map((p, i) => `
        <tr class="${p.hot ? "hot" : ""}">
          <td class="pos">${i + 1}. ${esc(p.th)} (${esc(p.en)})${p.hot ? '<span class="hot-badge">HOT</span>' : ""}</td>
          <td>${esc(p.gender)}</td>
          <td>${esc(p.age)}</td>
          <td class="salary"><b>${esc(p.salary)}</b><small>บาท / เดือน</small></td>
        </tr>`).join("");

      const benefits = c.benefits.map((b) => `
        <div class="benefit-card reveal"><span class="b-icon">${ICONS[b.icon] || ICONS.check}</span>
        <h3>${esc(b.title)}</h3><p>${esc(b.desc)}</p></div>`).join("");

      const hasPos = c.positions.length > 0;
      const posOptions = c.positions.map((p) => `<option>${esc(p.th)} (${esc(p.en)})</option>`).join("");
      /* แถวประสบการณ์ทำงาน: kind = "ในประเทศ" | "ต่างประเทศ", แถวที่ 1 บังคับกรอก แถวที่ 2 ไม่บังคับ */
      const expRow = (kind, key, n) => {
        const req = n === 1 ? " required" : "";
        const star = n === 1 ? ' <span class="req">*</span>' : "";
        const pre = `ประสบการณ์${kind} ${n}`;
        const id = `j-${key}-${n}`;
        return `<div class="exp-entry${key === "abroad" ? " four" : ""}">
          <div class="exp-no">${n}</div>
          ${key === "abroad" ? `<div class="field"><label for="${id}-country">ประเทศ${star}</label><input id="${id}-country" name="${pre} - ประเทศ"${req} placeholder="เช่น ไต้หวัน"></div>` : ""}
          <div class="field"><label for="${id}-co">บริษัท${star}</label><input id="${id}-co" name="${pre} - บริษัท"${req}></div>
          <div class="field"><label for="${id}-pos">ตำแหน่ง${star}</label><input id="${id}-pos" name="${pre} - ตำแหน่ง"${req}></div>
          <div class="field"><label for="${id}-dur">ระยะเวลา${star}</label><input id="${id}-dur" name="${pre} - ระยะเวลา"${req} placeholder="เช่น 2 ปี 6 เดือน"></div>
        </div>`;
      };
      const expBlock = (kind, key, num) => `
                <div class="form-group-title"><span class="n">${num}</span>ประสบการณ์ทำงาน${kind}</div>
                <div class="field"><span class="label">มีประสบการณ์ทำงาน${kind}หรือไม่ <span class="req">*</span></span>
                  <div class="choice-row">
                    <label class="choice"><input type="radio" name="ประสบการณ์${kind}" value="มี" required><span>มี</span></label>
                    <label class="choice"><input type="radio" name="ประสบการณ์${kind}" value="ไม่มี"><span>ไม่มี</span></label>
                  </div>
                </div>
                <div class="exp-list" data-show-when="ประสบการณ์${kind}=มี" hidden>
                  <p class="exp-hint">ใส่ได้สูงสุด 2 บริษัท (ล่าสุดก่อน) · บริษัทที่ 2 ไม่บังคับ</p>
                  ${expRow(kind, key, 1)}${expRow(kind, key, 2)}
                </div>`;
      const countryOptions = JOB_COUNTRIES.map((x) =>
        `<option value="${x.slug}" ${x.slug === c.slug ? "selected" : ""} ${x.active ? "" : "disabled"}>${x.nameTh} (${x.nameEn})${x.active ? "" : " — เร็วๆ นี้"}</option>`).join("");

      main.innerHTML = `
      <section class="job-hero media" data-img="${c.heroImage}">
        <div class="container">
          <div>
            <span class="legal-badge">${ICONS.star} จัดหางานถูกกฎหมาย 100%</span>
            <h1>เปิดรับสมัครงาน<span>ประเทศ${esc(c.nameTh)}</span></h1>
            <p class="lead">${esc(c.lead)}</p>
            <div class="contact-lines">
              <a href="tel:${c.phone.replace(/-/g, "")}">${ICONS.phone} ติดต่อสอบถามเพิ่มเติม: ${esc(c.phone)}</a>
              <a href="mailto:${c.email}">${ICONS.mail} อีเมลยื่นเอกสาร: ${esc(c.email)}</a>
            </div>
            <div class="hero-actions">
              <a href="#apply" class="btn btn-yellow">สมัครงานตอนนี้</a>
              <a href="#positions" class="btn btn-outline-light">ดูรายละเอียดงาน</a>
            </div>
          </div>
          <div class="flag-circle"><img src="${flagUrl(c.flag, 640)}" alt="ธงชาติ${esc(c.nameTh)}"></div>
        </div>
      </section>

      <section id="positions" class="section">
        <div class="container">
          <div class="text-center reveal">
            <span class="eyebrow">Opportunities</span>
            <h2 class="section-title" style="margin-top:8px">${hasPos ? `${c.positions.length} ตำแหน่งงานเด่น` : "ตำแหน่งงาน"} ประเทศ${esc(c.nameTh)}</h2>
            <p class="section-sub">${hasPos ? "ตารางรายละเอียดตำแหน่งงาน เพศ อายุ และเรทอัตราค่าจ้างขั้นต่ำรายเดือน (บาท)" : "กำลังอัปเดตตำแหน่งงานที่เปิดรับ — กรอกใบสมัครไว้ก่อนได้เลย เจ้าหน้าที่จะติดต่อกลับเมื่อมีตำแหน่งที่เหมาะกับคุณ"}</p>
            <div class="country-select-bar">
              <label for="cs">เปลี่ยนประเทศ:</label>
              <select id="cs" class="select-pretty">${countryOptions}</select>
            </div>
          </div>
          ${hasPos ? `<div class="table-card reveal">
            <div class="table-scroll">
              <table class="job-table">
                <thead><tr><th>ตำแหน่งงาน</th><th>เพศ</th><th>ช่วงอายุ</th><th>เงินเดือนโดยประมาณ / เดือน</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
            <div class="table-foot">* อัตราเงินเดือนคำนวณเป็นเงินบาทโดยประมาณ อาจเปลี่ยนแปลงตามอัตราแลกเปลี่ยนและเงื่อนไขของนายจ้าง</div>
          </div>` : `<div class="positions-soon reveal">${ICONS.clock || ""}<b>เร็วๆ นี้</b><span>สอบถามตำแหน่งงานล่าสุด โทร <a href="tel:${c.phone.replace(/-/g, "")}">${esc(c.phone)}</a></span><a href="#apply" class="btn btn-navy">ลงทะเบียนความสนใจ</a></div>`}
        </div>
      </section>

      ${c.benefits.length ? `<section class="section" style="padding-top:20px">
        <div class="container">
          <div class="text-center reveal">
            <h2 class="section-title">สิ่งที่คุณจะได้รับจากโครงการ</h2>
            <span class="title-underline"></span>
          </div>
          <div class="benefit-grid two" style="margin-top:44px">${benefits}</div>
        </div>
      </section>` : ""}

      <section id="apply" class="section apply-section">
        <div class="container">
          <div class="text-center reveal" style="margin-bottom:40px">
            <span class="eyebrow">Apply Now</span>
            <h2 class="section-title" style="margin-top:6px">สมัครงานประเทศ${esc(c.nameTh)}</h2>
            <p class="section-sub">กรอกข้อมูลเบื้องต้น เจ้าหน้าที่ Winner 96 จะติดต่อกลับเพื่อสัมภาษณ์และแจ้งเอกสารที่ต้องใช้</p>
          </div>
          <div class="apply-wrap">
            <aside class="apply-aside reveal">
              <h3>ขั้นตอนการสมัคร</h3>
              <p>ดำเนินการถูกต้องตามกฎหมาย ดูแลครบทุกขั้นตอน</p>
              <ol class="steps">
                <li><b>ลงทะเบียนสมัครงาน</b><span>กรอกฟอร์มนี้เพื่อเลือกตำแหน่ง</span></li>
                <li><b>สัมภาษณ์ &amp; ตรวจสอบคุณสมบัติ</b><span>เจ้าหน้าที่ติดต่อกลับ</span></li>
                <li><b>ยื่นเอกสาร &amp; ทำวีซ่าทำงาน</b><span>ส่งเอกสารทางอีเมล ${esc(c.email)}</span></li>
                <li><b>อบรมก่อนเดินทาง &amp; บินไปทำงาน</b><span>มีทีมดูแลตลอดสัญญาจ้าง</span></li>
              </ol>
              <div class="aside-contact">
                <a href="tel:${c.phone.replace(/-/g, "")}">${ICONS.phone} ${esc(c.phone)}</a>
                <a href="mailto:${c.email}">${ICONS.mail} ${esc(c.email)}</a>
              </div>
            </aside>
            <div class="form-card reveal">
              <form data-form="job">
                <input type="hidden" name="ประเทศ" value="${esc(c.nameTh)} (${esc(c.nameEn)})">
                <h3>ใบสมัครงาน · ${esc(c.nameEn)}</h3>
                <p class="form-sub">ช่องที่มีเครื่องหมาย <span style="color:#e11d48">*</span> จำเป็นต้องกรอก</p>
                <div class="form-group-title"><span class="n">1</span>ตำแหน่งงานที่สนใจ</div>
                <div class="form-grid">
                  <div class="field full"><label for="j-pos">ตำแหน่งงานที่สนใจ <span class="req">*</span></label>
                    ${hasPos ? `<select id="j-pos" name="ตำแหน่ง" required><option value="">— เลือกตำแหน่ง —</option>${posOptions}</select>`
                      : `<input id="j-pos" name="ตำแหน่ง" required placeholder="เช่น พนักงานโรงงาน, แม่บ้าน, ช่างเชื่อม">`}
                  </div>
                </div>

                <div class="form-group-title"><span class="n">2</span>ข้อมูลส่วนตัว</div>
                <div class="form-grid">
                  <div class="field"><label for="j-name">ชื่อ-นามสกุล (ภาษาไทย) <span class="req">*</span></label><input id="j-name" name="ชื่อ-นามสกุล" required autocomplete="name" placeholder="เช่น สมชาย ใจดี"></div>
                  <div class="field"><label for="j-name-en">ชื่อ-นามสกุล (ภาษาอังกฤษ) <span class="req">*</span></label><input id="j-name-en" name="ชื่อ-นามสกุล (อังกฤษ)" required placeholder="เช่น Somchai Jaidee" autocomplete="off" lang="en"></div>
                  <div class="field"><span class="label">เพศ <span class="req">*</span></span>
                    <div class="choice-row">
                      <label class="choice"><input type="radio" name="เพศ" value="ชาย" required><span>ชาย</span></label>
                      <label class="choice"><input type="radio" name="เพศ" value="หญิง"><span>หญิง</span></label>
                    </div>
                  </div>
                  <div class="field"><label for="j-passport">หนังสือเดินทาง</label>
                    <select id="j-passport" name="หนังสือเดินทาง"><option value="">— เลือก —</option><option>มีแล้ว</option><option>ยังไม่มี</option></select>
                  </div>
                  <div class="field"><label for="j-dob">วันเกิด <span class="req">*</span></label><input id="j-dob" name="วันเกิด" required data-thai-date data-min="1955-01-01" data-max="today" data-view-years-ago="25"></div>
                  <div class="field"><label for="j-age">อายุ (ปี) <span class="req">*</span></label><input id="j-age" type="number" min="18" max="65" name="อายุ" required readonly tabindex="-1" placeholder="คำนวณจากวันเกิดอัตโนมัติ" class="is-auto"></div>
                  <div class="field"><label for="j-height">ส่วนสูง (ซม.) <span class="req">*</span></label><input id="j-height" type="number" min="120" max="220" name="ส่วนสูง (ซม.)" required inputmode="numeric" placeholder="เช่น 165"></div>
                </div>

                <div class="form-group-title"><span class="n">3</span>ที่อยู่และการติดต่อ</div>
                <div class="form-grid">
                  <div class="field full"><label for="j-addr-id">ที่อยู่ตามบัตรประชาชน <span class="req">*</span></label><textarea id="j-addr-id" name="ที่อยู่ตามบัตรประชาชน" required placeholder="บ้านเลขที่ หมู่ ถนน ตำบล/แขวง อำเภอ/เขต จังหวัด รหัสไปรษณีย์"></textarea></div>
                  <div class="field full"><label for="j-addr">ที่อยู่ที่สามารถติดต่อได้ <span class="req">*</span></label>
                    <label class="same-addr"><input type="checkbox" id="j-addr-same"> ใช้ที่อยู่เดียวกับบัตรประชาชน</label>
                    <textarea id="j-addr" name="ที่อยู่ที่ติดต่อได้" required placeholder="บ้านเลขที่ หมู่ ถนน ตำบล/แขวง อำเภอ/เขต จังหวัด รหัสไปรษณีย์"></textarea></div>
                  <div class="field"><label for="j-tel">เบอร์โทรศัพท์ <span class="req">*</span></label><input id="j-tel" type="tel" name="เบอร์โทร" required inputmode="tel" placeholder="08xxxxxxxx"></div>
                  <div class="field full"><label for="j-email">อีเมล</label><input id="j-email" type="email" name="อีเมล"></div>
                </div>

                <div class="form-group-title"><span class="n">4</span>การศึกษา</div>
                <div class="form-grid">
                  <div class="field"><label for="j-edu">ระดับการศึกษาสูงสุด <span class="req">*</span></label>
                    <select id="j-edu" name="ระดับการศึกษาสูงสุด" required><option value="">— เลือก —</option><option>ประถมศึกษา</option><option>มัธยมศึกษาตอนต้น (ม.3)</option><option>มัธยมศึกษาตอนปลาย (ม.6)</option><option>ปวช.</option><option>ปวส. / อนุปริญญา</option><option>ปริญญาตรี</option><option>สูงกว่าปริญญาตรี</option></select>
                  </div>
                  <div class="field"><label for="j-school">โรงเรียน / มหาวิทยาลัย <span class="req">*</span></label><input id="j-school" name="สถานศึกษา" required></div>
                </div>
${expBlock("ในประเทศ", "local", 5)}
${expBlock("ต่างประเทศ", "abroad", 6)}

                <div class="form-group-title"><span class="n">7</span>ข้อมูลเพิ่มเติม</div>
                <div class="field"><label for="j-msg">รายละเอียดเพิ่มเติม</label><textarea id="j-msg" name="ข้อความเพิ่มเติม" placeholder="เช่น ทักษะพิเศษ ภาษา หรือคำถาม"></textarea></div>
                <label class="consent"><input type="checkbox" name="ยินยอม PDPA" value="ยินยอม" required>
                  <span>ข้าพเจ้ายินยอมให้ Winner 96 Management Manpower Co.,Ltd เก็บและใช้ข้อมูลส่วนบุคคลข้างต้น เพื่อการติดต่อกลับและพิจารณาการสมัครงาน ตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล (PDPA)</span></label>
                <div class="form-actions">
                  <button type="submit" class="btn btn-navy">ส่งใบสมัคร</button>
                  <span class="form-note">ข้อมูลของคุณจะถูกเก็บเป็นความลับ</span>
                </div>
              </form>
              <div class="form-success" role="status">
                <div class="ok">${ICONS.check}</div>
                <h3>ส่งใบสมัครเรียบร้อยแล้ว!</h3>
                <p>ทีมงาน Winner 96 จะติดต่อกลับโดยเร็วที่สุด<br>สอบถามเพิ่มเติม โทร ${esc(c.phone)}</p>
                <div style="margin-top:20px"><button type="button" class="btn btn-yellow" data-form-again>สมัครอีกตำแหน่ง</button></div>
              </div>
            </div>
          </div>
        </div>
      </section>`;

      document.getElementById("cs").addEventListener("change", (e) => (location.href = `job-country.html?c=${e.target.value}`));
      /* ===== ใบสมัคร: อายุจากวันเกิด, ที่อยู่เดียวกัน, ช่องที่แสดงตามเงื่อนไข ===== */
      (function () {
        const form = main.querySelector('form[data-form="job"]');
        if (!form) return;
        const dob = form.querySelector("#j-dob"), age = form.querySelector("#j-age");
        const calcAge = () => {
          if (!dob.dataset.iso) { age.value = ""; return; }
          const b = new Date(dob.dataset.iso + "T00:00:00"), t = new Date();
          let a = t.getFullYear() - b.getFullYear();
          if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
          age.value = a >= 0 ? a : "";
          age.closest(".field").classList.remove("invalid");
        };
        dob.addEventListener("change", calcAge);
        dob.addEventListener("input", calcAge);

        const same = form.querySelector("#j-addr-same"), addrId = form.querySelector("#j-addr-id"), addr = form.querySelector("#j-addr");
        const syncAddr = () => { if (same.checked) addr.value = addrId.value; addr.readOnly = same.checked; addr.classList.toggle("is-auto", same.checked); };
        same.addEventListener("change", syncAddr);
        addrId.addEventListener("input", () => same.checked && syncAddr());

        const blocks = form.querySelectorAll("[data-show-when]");
        const sync = () => blocks.forEach((b) => {
          const [name, val] = b.dataset.showWhen.split("=");
          const on = !!form.querySelector(`[name="${CSS.escape(name)}"][value="${CSS.escape(val)}"]:checked`);
          b.hidden = !on;
          b.querySelectorAll("input, select, textarea").forEach((el) => (el.disabled = !on));
        });
        form.addEventListener("change", (e) => { if (e.target.type === "radio") sync(); });
        form.addEventListener("reset", () => setTimeout(() => { sync(); syncAddr(); age.value = ""; }));
        sync();
      })();

      if (location.hash) setTimeout(() => document.querySelector(location.hash)?.scrollIntoView(), 50);
    })();
  </script>
  <script src="js/forms.js"></script>
</body>
</html>
